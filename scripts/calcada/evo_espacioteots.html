<script>
(function(){
  var MESES=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var cal=document.getElementById('evcal_calendar_235'); if(!cal) return;
  var tpl=document.getElementById('evo_fila').innerHTML, lista=cal.querySelector('#evcal_list');
  var hoy=new Date(), y=hoy.getFullYear(), m=hoy.getMonth(), y0=y, m0=m;
  function p2(n){return (n<10?'0':'')+n}
  function pinta(){
    cal.querySelector('#evcal_cur').textContent=' '+MESES[m]+', '+y;
    cal.querySelector('.evo-gototoday-btn').style.display=(y===y0&&m===m0)?'none':'';
    var html='', d=new Date(y,m,1);
    while(d.getDay()!==4) d.setDate(d.getDate()+1);
    for(;d.getMonth()===m;d.setDate(d.getDate()+7)){
      var fin=new Date(d.getFullYear(),d.getMonth(),d.getDate(),20,0), ini=new Date(d.getFullYear(),d.getMonth(),d.getDate(),19,0);
      var off=-ini.getTimezoneOffset(), tz='(GMT'+(off>=0?'+':'-')+p2(Math.floor(Math.abs(off)/60))+':'+p2(Math.abs(off)%60)+')';
      var iso=function(t){return t.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')};
      html+=tpl.replace('{{PAST}}',fin<hoy?'past_event':'').replace('{{DD}}',p2(d.getDate()))
        .replace('{{MON}}',MESES[m].slice(0,3).toLowerCase()).replace('{{LARGA}}',MESES[m]+' '+d.getDate()+', '+y)
        .replace('{{TZ}}',tz).replace('{{GCAL}}',iso(ini)+'/'+iso(fin));
    }
    lista.innerHTML=html||'<div class="eventon_list_event no_events"><p class="no_events">No Events</p></div>';
  }
  cal.addEventListener('click',function(e){
    var t=e.target.closest('#evcal_prev,#evcal_next,.evo-gototoday-btn,.desc_trig,.evcal_close'); if(!t) return;
    e.preventDefault();
    if(t.id==='evcal_prev'){m--; if(m<0){m=11;y--} pinta()}
    else if(t.id==='evcal_next'){m++; if(m>11){m=0;y++} pinta()}
    else if(t.classList.contains('evo-gototoday-btn')){y=y0;m=m0;pinta()}
    else { var c=t.closest('.eventon_list_event').querySelector('.event_description'); c.style.display=(c.style.display==='none')?'block':'none'; }
  });
  pinta();
})();
</script>
